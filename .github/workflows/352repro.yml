name: Internal PR 3 - version semver range input reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@main
      - name: Pass unsupported semver range to dotnet-version
        id: setup
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '^8.0.0'
          check-latest: true
          skip-lts-prepass: true
          cache: false

    
