name: Reproduce setup-dotnet ARM64 crash

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install both SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json   # sdk 10.0.401, rollForward latestFeature
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'
