name: Test skip-lts-prepass PR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-formats:
    name: Version - ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: exact
            version: "9.0.203"
            channel: ""
            expected: "^9\\.0\\.203$"

          - name: minor-wildcard
            version: "9.0.x"
            channel: ""
            expected: "^9\\.0\\.\\d+$"

          - name: feature-band
            version: "9.0.2xx"
            channel: ""
            expected: "^9\\.0\\.2\\d{2}$"

          - name: latest-channel
            version: "latest"
            channel: "9.0"
            expected: "^9\\.0\\.\\d+$"

          - name: surrounding-whitespace
            version: " 9.0.203 "
            channel: ""
            expected: "^9\\.0\\.203$"

    env:
      DOTNET_MULTILEVEL_LOOKUP: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Set isolated installation directory
        shell: bash
        run: |
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Ensure isolated installation starts empty
        shell: bash
        run: |
          : "${DOTNET_INSTALL_DIR:?DOTNET_INSTALL_DIR is not set}"
          rm -rf -- "$DOTNET_INSTALL_DIR"

      - name: Run PR action
        id: setup
        uses: v-chiranjib-swain/setup-dotnet@4cc40cabfa9f93db073bf49374d00a8147d775e9
        with:
          dotnet-version: ${{ matrix.version }}
          dotnet-channel: ${{ matrix.channel }}
          skip-lts-prepass: true

      - name: Verify SDK and absence of unrelated LTS runtime
        shell: pwsh
        env:
          EXPECTED: ${{ matrix.expected }}
        run: |
          $actual = (dotnet --version).Trim()

          if ($actual -notmatch $env:EXPECTED) {
            throw "SDK '$actual' does not match '$env:EXPECTED'."
          }

          $output = '${{ steps.setup.outputs.dotnet-version }}'

          if ($output -notmatch $env:EXPECTED) {
            throw "Action output '$output' does not match '$env:EXPECTED'."
          }

          $coreRuntimes = @(
            dotnet --list-runtimes |
              Where-Object {
                $_ -match '^Microsoft\.NETCore\.App '
              }
          )

          if ($coreRuntimes.Count -eq 0) {
            throw "No Microsoft.NETCore.App runtime was installed."
          }

          $unexpected = @(
            $coreRuntimes |
              Where-Object {
                $_ -notmatch '^Microsoft\.NETCore\.App 9\.0\.'
              }
          )

          if ($unexpected.Count -gt 0) {
            throw "Unexpected runtime suggests an LTS pre-pass occurred:`n$($unexpected -join "`n")"
          }

          Write-Host "Installed SDK:"
          dotnet --version

          Write-Host "Installed runtimes:"
          dotnet --list-runtimes

          Write-Host "DOTNET_INSTALL_DIR:"
          Write-Host $env:DOTNET_INSTALL_DIR

  no-version-and-global-json:
    name: No version and global.json
    runs-on: ubuntu-latest

    env:
      DOTNET_MULTILEVEL_LOOKUP: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Set isolated installation directory
        shell: bash
        run: |
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet-global-json" >> "$GITHUB_ENV"

      - name: Ensure no version source exists
        shell: bash
        run: |
          : "${DOTNET_INSTALL_DIR:?DOTNET_INSTALL_DIR is not set}"
          rm -rf -- "$DOTNET_INSTALL_DIR"
          rm -f global.json

      - name: Run action without dotnet-version or global.json
        uses: v-chiranjib-swain/setup-dotnet@4cc40cabfa9f93db073bf49374d00a8147d775e9
        with:
          skip-lts-prepass: true

      - name: Verify nothing was installed
        shell: bash
        run: |
          : "${DOTNET_INSTALL_DIR:?DOTNET_INSTALL_DIR is not set}"

          if [ -e "$DOTNET_INSTALL_DIR" ]; then
            echo "Unexpected installation:"
            find "$DOTNET_INSTALL_DIR" -maxdepth 3 -print
            exit 1
          fi

      - name: Create global.json
        shell: bash
        run: |
          cat > global.json <<'JSON'
          {
            "sdk": {
              "version": "9.0.203",
              "rollForward": "disable"
            }
          }
          JSON

      - name: Run action using global.json
        id: from-global-json
        uses: v-chiranjib-swain/setup-dotnet@4cc40cabfa9f93db073bf49374d00a8147d775e9
        with:
          skip-lts-prepass: true

      - name: Verify global.json version
        shell: bash
        run: |
          test "$(dotnet --version)" = "9.0.203"
          test "${{ steps.from-global-json.outputs.dotnet-version }}" = "9.0.203"

          dotnet --info

  clean-container:
    name: Clean container
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/dotnet/runtime-deps:9.0-noble

    env:
      DOTNET_INSTALL_DIR: /tmp/dotnet-under-test
      DOTNET_MULTILEVEL_LOOKUP: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Install download prerequisites
        shell: bash
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends curl ca-certificates

      - name: Verify container starts without dotnet
        shell: bash
        run: |
          : "${DOTNET_INSTALL_DIR:?DOTNET_INSTALL_DIR is not set}"
          rm -rf -- "$DOTNET_INSTALL_DIR"

          if command -v dotnet >/dev/null 2>&1; then
            echo "Container unexpectedly contains dotnet:"
            command -v dotnet
            exit 1
          fi

      - name: Install directly without LTS pre-pass
        id: setup
        uses: v-chiranjib-swain/setup-dotnet@4cc40cabfa9f93db073bf49374d00a8147d775e9
        with:
          dotnet-version: "9.0.203"
          skip-lts-prepass: true

      - name: Verify clean-container installation
        shell: bash
        run: |
          test "$(dotnet --version)" = "9.0.203"
          test "${{ steps.setup.outputs.dotnet-version }}" = "9.0.203"

          unexpected="$(
            dotnet --list-runtimes |
              awk '$1 == "Microsoft.NETCore.App" && $2 !~ /^9\.0\./'
          )"

          if [ -n "$unexpected" ]; then
            echo "Unexpected additional runtime:"
            echo "$unexpected"
            exit 1
          fi

          dotnet --info

  existing-remove-and-reinstall:
    name: Reuse, remove, and reinstall
    runs-on: ubuntu-latest

    env:
      DOTNET_MULTILEVEL_LOOKUP: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Set isolated installation directory
        shell: bash
        run: |
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet-reinstall" >> "$GITHUB_ENV"

      - name: Start clean
        shell: bash
        run: |
          : "${DOTNET_INSTALL_DIR:?DOTNET_INSTALL_DIR is not set}"
          rm -rf -- "$DOTNET_INSTALL_DIR"

      - name: Initial installation
        id: initial
        uses: v-chiranjib-swain/setup-dotnet@4cc40cabfa9f93db073bf49374d00a8147d775e9
        with:
          dotnet-version: "9.0.203"
          skip-lts-prepass: true

      - name: Verify initial installation
        shell: bash
        run: |
          test "${{ steps.initial.outputs.dotnet-version }}" = "9.0.203"
          test "$(dotnet --version)" = "9.0.203"
          test -x "$DOTNET_INSTALL_DIR/dotnet"
          test -f "$DOTNET_INSTALL_DIR/sdk/9.0.203/dotnet.dll"

      - name: Reuse existing installation
        id: reuse
        uses: v-chiranjib-swain/setup-dotnet@4cc40cabfa9f93db073bf49374d00a8147d775e9
        with:
          dotnet-version: "9.0.203"
          check-latest: false
          skip-lts-prepass: true

      - name: Verify reuse
        shell: bash
        run: |
          test "${{ steps.reuse.outputs.dotnet-version }}" = "9.0.203"
          test "$(dotnet --version)" = "9.0.203"
          test -x "$DOTNET_INSTALL_DIR/dotnet"
          test -f "$DOTNET_INSTALL_DIR/sdk/9.0.203/dotnet.dll"

      - name: Remove existing dotnet installation
        shell: bash
        run: |
          : "${DOTNET_INSTALL_DIR:?DOTNET_INSTALL_DIR is not set}"
          rm -rf -- "$DOTNET_INSTALL_DIR"
          test ! -e "$DOTNET_INSTALL_DIR"

      - name: Reinstall after removal
        id: reinstall
        uses: v-chiranjib-swain/setup-dotnet@4cc40cabfa9f93db073bf49374d00a8147d775e9
        with:
          dotnet-version: "9.0.203"
          check-latest: false
          skip-lts-prepass: true

      - name: Verify reinstall
        shell: bash
        run: |
          test "${{ steps.reinstall.outputs.dotnet-version }}" = "9.0.203"
          test "$(dotnet --version)" = "9.0.203"
          test -x "$DOTNET_INSTALL_DIR/dotnet"
          test -f "$DOTNET_INSTALL_DIR/sdk/9.0.203/dotnet.dll"

  nuget-cache:
    name: NuGet cache
    runs-on: ubuntu-latest

    env:
      DOTNET_MULTILEVEL_LOOKUP: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Set isolated directories
        shell: bash
        run: |
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet-cache-test" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget-packages" >> "$GITHUB_ENV"

      - name: Clear SDK and NuGet directories
        shell: bash
        run: |
          : "${DOTNET_INSTALL_DIR:?DOTNET_INSTALL_DIR is not set}"
          : "${NUGET_PACKAGES:?NUGET_PACKAGES is not set}"

          rm -rf -- "$DOTNET_INSTALL_DIR"
          rm -rf -- "$NUGET_PACKAGES"

      - name: Create cache dependency file
        shell: bash
        run: |
          cat > packages.lock.json <<'JSON'
          {
            "version": 1,
            "dependencies": {}
          }
          JSON

      - name: Setup .NET with NuGet cache
        id: cached-setup
        uses: v-chiranjib-swain/setup-dotnet@4cc40cabfa9f93db073bf49374d00a8147d775e9
        with:
          dotnet-version: "9.0.203"
          skip-lts-prepass: true
          cache: true
          cache-dependency-path: packages.lock.json

      - name: Verify SDK installation
        shell: bash
        run: |
          test "$(dotnet --version)" = "9.0.203"
          dotnet --info

      - name: Exercise NuGet package directory
        shell: bash
        run: |
          mkdir -p "$NUGET_PACKAGES"
          printf 'cache-test\n' > "$NUGET_PACKAGES/setup-dotnet-cache-test"

          echo "Cache hit: ${{ steps.cached-setup.outputs.cache-hit }}"

          if [ "${{ steps.cached-setup.outputs.cache-hit }}" = "true" ]; then
            test -f "$NUGET_PACKAGES/setup-dotnet-cache-test"
          fi

      - name: Clear local NuGet cache
        shell: bash
        run: |
          dotnet nuget locals all --clear

      - name: Verify NuGet cache directory was cleared
        shell: bash
        run: |
          if [ -d "$NUGET_PACKAGES" ] && [ -n "$(find "$NUGET_PACKAGES" -mindepth 1 -print -quit)" ]; then
            echo "NuGet package directory is not empty after clearing:"
            find "$NUGET_PACKAGES" -maxdepth 3 -print
            exit 1
          fi

      - name: Recreate package marker for post-job cache save
        shell: bash
        run: |
          mkdir -p "$NUGET_PACKAGES"
          printf 'cache-test\n' > "$NUGET_PACKAGES/setup-dotnet-cache-test"
