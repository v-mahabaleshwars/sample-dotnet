name: Test setup-dotnet PR 803

on:
  workflow_dispatch:

jobs:
  baseline-latest-major:
    name: Baseline latestMajor
    runs-on: ubuntu-latest
    steps:
      - name: Create global.json
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "11.0.100",
              "rollForward": "latestMajor",
              "allowPrerelease": false
            }
          }
          EOF

      - name: Run published setup-dotnet
        id: setup
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          check-latest: true

      - name: Report baseline
        shell: bash
        run: |
          sdk_output=$(dotnet --list-sdks 2>&1 || true)

          echo "### Previous published behavior" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action output: \`${{ steps.setup.outputs.dotnet-version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Installed SDKs:" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$sdk_output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "- Expected: may install LTS even though global.json requires 11.0.100." >> "$GITHUB_STEP_SUMMARY"

  pr-latest-major:
    name: PR latestMajor selects newest GA
    runs-on: ubuntu-latest
    steps:
      - name: Create global.json
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "11.0.100",
              "rollForward": "latestMajor",
              "allowPrerelease": false
            }
          }
          EOF

      - name: Run PR 803
        id: setup
        uses: kamronbatman/setup-dotnet@e52d8212e2e1494a96dc9a736b9dd80120ccad12
        with:
          global-json-file: global.json
          dotnet-quality: ga
          check-latest: true

      - name: Report PR result
        shell: bash
        run: |
          sdk_output=$(dotnet --list-sdks)
          selected=$(dotnet --version)

          echo "### PR 803: latestMajor" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action output: \`${{ steps.setup.outputs.dotnet-version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- dotnet --version: \`$selected\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Installed SDKs:" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$sdk_output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          major="${selected%%.*}"
          if [[ "$major" -ge 11 ]]; then
            echo "- Result: **PASS** — selected SDK is at least 11.0.100." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Result: **FAIL** — selected SDK is below 11.0.100." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  pr-latest-major-preview-quality:
    name: PR latestMajor ignores preview quality
    runs-on: ubuntu-latest
    steps:
      - name: Create global.json
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "11.0.100",
              "rollForward": "latestMajor",
              "allowPrerelease": false
            }
          }
          EOF

      - name: Run PR 803
        id: setup
        uses: kamronbatman/setup-dotnet@e52d8212e2e1494a96dc9a736b9dd80120ccad12
        with:
          global-json-file: global.json
          dotnet-quality: preview
          check-latest: true

      - name: Verify GA result
        shell: bash
        run: |
          selected=$(dotnet --version)

          echo "### PR 803: latestMajor with preview quality" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action output: \`${{ steps.setup.outputs.dotnet-version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- dotnet --version: \`$selected\`" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$selected" == *"-"* ]]; then
            echo "- Result: **FAIL** — preview SDK was selected." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "- Result: **PASS** — dotnet-quality was ignored and a GA SDK was selected." >> "$GITHUB_STEP_SUMMARY"

  pr-empty-version-no-sdk:
    name: PR empty version keeps LTS fallback
    runs-on: ubuntu-latest
    steps:
      - name: Create global.json without sdk.version
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "rollForward": "latestMajor"
            }
          }
          EOF

      - name: Run PR 803
        id: setup
        uses: kamronbatman/setup-dotnet@e52d8212e2e1494a96dc9a736b9dd80120ccad12
        with:
          global-json-file: global.json
          check-latest: true

      - name: Report fallback
        shell: bash
        run: |
          selected=$(dotnet --version)
          sdk_output=$(dotnet --list-sdks)

          echo "### PR 803: empty version without latestMajor resolution" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action output: \`${{ steps.setup.outputs.dotnet-version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- dotnet --version: \`$selected\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Installed SDKs:" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$sdk_output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "- Expected: unchanged LTS fallback behavior." >> "$GITHUB_STEP_SUMMARY"

  pr-pinned-prerelease:
    name: PR pinned prerelease remains exact
    runs-on: ubuntu-latest
    steps:
      - name: Create global.json
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "8.0.100-preview.1",
              "allowPrerelease": true
            }
          }
          EOF

      - name: Run PR 803
        id: setup
        uses: kamronbatman/setup-dotnet@e52d8212e2e1494a96dc9a736b9dd80120ccad12
        with:
          global-json-file: global.json
          check-latest: true

      - name: Verify exact prerelease
        shell: bash
        run: |
          selected=$(dotnet --version)

          echo "### PR 803: pinned prerelease" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action output: \`${{ steps.setup.outputs.dotnet-version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- dotnet --version: \`$selected\`" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$selected" != "8.0.100-preview.1" ]]; then
            echo "- Result: **FAIL** — prerelease was not pinned exactly." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "- Result: **PASS** — exact pinned prerelease was retained." >> "$GITHUB_STEP_SUMMARY"
